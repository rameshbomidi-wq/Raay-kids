<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-6ZG763KFGF');</script>
<style>
:root{--g:#4CAF50;--gd:#2e7d32;--bg:#f3f7f3;--card:#fff;--tx:#1b1b1b;--mu:#666;--ac:#ff9800}
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Sans Telugu','Baloo Tamma 2',sans-serif;background:var(--bg);color:var(--tx)}
header.top{background:#1b1b1b;color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20}
header.top button{background:none;border:0;color:#fff;font-size:26px;cursor:pointer;display:none;padding:0 6px}
header.top h1{font-size:19px;margin:0;flex:1}
main{max-width:760px;margin:0 auto;padding:14px}
.home h2{text-align:center;font-size:28px;margin:16px 0 22px;font-weight:800}
.mbtn{display:block;width:100%;background:var(--g);color:#fff;border:0;border-radius:8px;padding:16px;font-size:21px;margin:0 0 14px;cursor:pointer;font-family:inherit;box-shadow:0 2px 4px #0002}
.mbtn:active{background:var(--gd)}
.mbtn small{display:block;font-size:13px;opacity:.92;margin-top:2px}
section.tool{display:none}
.card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:14px;box-shadow:0 1px 4px #0001}
.card h3{margin:0 0 10px;color:var(--gd)}
.btn{display:inline-block;background:var(--g);color:#fff;border:0;border-radius:8px;padding:10px 14px;font-size:15px;cursor:pointer;font-family:inherit;margin:3px}
.btn.o{background:#fff;color:var(--gd);border:2px solid var(--g)}
.btn.a{background:var(--ac)}
.btn.r{background:#e53935}
.btn:disabled{opacity:.45}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{padding:7px 11px;border-radius:20px;border:2px solid var(--g);background:#fff;color:var(--gd);cursor:pointer;font-family:inherit;font-size:14px}
.chip.on{background:var(--g);color:#fff}
input,select,textarea{font-family:inherit;font-size:15px;padding:8px;border:1px solid #bbb;border-radius:8px;background:#fff}
textarea{width:100%;min-height:220px;line-height:1.6}
label{font-size:14px}
.mu{color:var(--mu);font-size:13px}
footer{text-align:center;padding:18px;font-size:15px}
footer a,.brand a{color:var(--gd);font-weight:800;text-decoration:none}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:20px;opacity:0;transition:.3s;z-index:99;pointer-events:none}
#toast.show{opacity:1}
/* numbers */
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(50px,1fr));gap:5px}
.ngrid button{padding:9px 0;border:1px solid #cfe3cf;background:#f7fbf7;border-radius:6px;font-size:16px;cursor:pointer;font-family:inherit}
.ngrid button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.bignum{font-size:72px;font-weight:800;text-align:center;color:var(--gd);line-height:1.1}
.tedig{text-align:center;font-size:30px;color:#8e24aa}
.pv{display:flex;justify-content:center;gap:8px;margin:10px 0}
.pv div{border:2px solid var(--g);border-radius:8px;padding:6px 12px;text-align:center;min-width:70px}
.pv b{font-size:26px;display:block}.pv span{font-size:12px;color:var(--mu)}
.enw{text-align:center;font-size:22px;text-transform:capitalize;color:#1565c0}
.tew{text-align:center;font-size:24px;font-weight:600;margin-bottom:8px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.opts button{padding:16px 6px;font-size:24px;border-radius:10px;border:2px solid #ccc;background:#fff;cursor:pointer;font-family:inherit}
.opts button.ok{background:#c8e6c9;border-color:var(--g)}
.opts button.no{background:#ffcdd2;border-color:#e53935}
.qhead{text-align:center;font-size:20px;font-weight:600}
.qbig{text-align:center;font-size:56px}
/* passport */
.cwrap{display:flex;justify-content:center;background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 0 0/16px 16px;padding:10px;border-radius:8px}
.cc{touch-action:none;box-shadow:0 0 0 2px #333;cursor:grab;background:#fff}
.ctl{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin:10px 0}
.ctl label{display:flex;flex-direction:column}
.res img{max-width:100%;max-height:420px;display:block;margin:0 auto 8px;box-shadow:0 0 0 1px #999}
/* jumble */
.jpic{font-size:80px;text-align:center}
.jhint{text-align:center;font-size:20px;color:#1565c0;margin-bottom:8px}
.jans,.jtiles{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;min-height:64px;margin:8px 0}
.slot,.tile{min-width:58px;height:58px;padding:0 8px;border-radius:10px;font-size:28px;display:flex;align-items:center;justify-content:center;font-family:inherit}
.slot{border:2px dashed #aaa;background:#fafafa;cursor:pointer}
.slot.f{border-style:solid;border-color:#1565c0;background:#e3f2fd}
.tile{border:0;background:var(--ac);color:#fff;cursor:pointer;box-shadow:0 3px 0 #c66900}
.tile.u{visibility:hidden}
.jmsg{text-align:center;font-size:22px;min-height:32px;font-weight:600}
/* words */
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.wc{border:2px solid #e0e0e0;border-radius:12px;padding:10px;text-align:center;cursor:pointer;background:#fff}
.wc:active,.wc.on{border-color:var(--ac);background:#fff3e0}
.wc .e{font-size:42px}.wc .w{font-size:28px;font-weight:800;color:#1565c0;letter-spacing:2px}
.wc .t{font-size:16px}.wc .p{font-size:13px;color:var(--mu)}
.vw{color:#e53935}
/* letters */
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:7px}
.lgrid button{font-size:30px;padding:8px 0;border-radius:10px;border:2px solid #c5cae9;background:#e8eaf6;cursor:pointer;font-family:inherit;color:#283593}
.lgrid button.v{background:#ffebee;border-color:#ef9a9a;color:#c62828}
.lgrid button.on{outline:3px solid var(--ac)}
.ldet{text-align:center}
.ldet .L{font-size:90px;font-weight:800;color:#283593;line-height:1}
.ldet .tn{font-size:24px;color:#8e24aa}
.ldet .wd{font-size:26px;margin-top:6px}
.trc{touch-action:none;border:2px solid #333;border-radius:10px;background:#fff;display:block;margin:0 auto}
/* compressor */
.citem{display:flex;gap:10px;align-items:center;border-bottom:1px solid #eee;padding:8px 0}
.citem img{width:64px;height:64px;object-fit:cover;border-radius:6px}
.citem .inf{flex:1;font-size:13px}
.prog{height:10px;background:#eee;border-radius:5px;overflow:hidden;margin:8px 0}
.prog div{height:100%;width:0;background:var(--g);transition:.2s}
.stat{font-size:13px;color:var(--mu);margin:6px 0}
@media(max-width:420px){.ctl{grid-template-columns:1fr}.bignum{font-size:60px}}
@media print{header,footer,.noprint{display:none!important}}

.ghead{font-size:19px;font-weight:800;color:var(--gd);margin:20px 2px 10px;border-bottom:2px solid #c8e6c9;padding-bottom:4px}
#stars{font-weight:800;background:#333;padding:4px 10px;border-radius:14px;font-size:15px}
#stars.pop{animation:pop .5s}@keyframes pop{50%{transform:scale(1.4)}}
.tnote{background:#f3e5f5}.tnote summary{cursor:pointer;font-weight:600;color:#6a1b9a}.tnote div{margin-top:8px;line-height:1.75;font-size:14px}
.big{font-size:38px;font-weight:800;color:#1565c0}
.sbv{min-height:170px;display:flex;align-items:center;justify-content:center}.dsvg{width:100%;max-width:420px}
.bkcols{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:6px;text-align:center}
.bkc{border:2px solid #e0e0e0;border-radius:10px;padding:6px;display:flex;flex-direction:column;justify-content:space-between}
.bkc .btn{padding:8px 12px;font-size:18px}
.bkarea{min-height:120px;display:flex;flex-wrap:wrap;gap:3px;align-content:flex-start;justify-content:center;padding:4px}
.bk-h{display:grid;grid-template-columns:repeat(10,4px);gap:1px;background:#1565c0;padding:1px}.bk-h i{width:4px;height:4px;background:#64b5f6}
.bk-t{display:grid;grid-template-rows:repeat(10,8px);gap:1px;background:#2e7d32;padding:1px}.bk-t i{width:8px;height:8px;background:#81c784}
.bk-o i{display:block;width:12px;height:12px;background:#ffb300;border:1px solid #e65100}
.nlw svg{width:100%}
.clk{width:220px;max-width:70vw;display:block;margin:0 auto 6px}
.coin{display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:50%;background:radial-gradient(#eceff1,#90a4ae);border:3px solid #78909c;font-weight:800;font-size:15px;margin:3px;color:#263238;vertical-align:middle}
.coin.gold{background:radial-gradient(#fff8e1,#ffb300);border-color:#ff8f00}
.note{display:inline-flex;align-items:center;justify-content:center;width:92px;height:46px;border-radius:6px;border:2px solid #0004;font-weight:800;font-size:17px;margin:3px;color:#212121;box-shadow:inset 0 0 0 4px #fff6;vertical-align:middle}
.mtray{min-height:70px;border:2px dashed #aaa;border-radius:10px;padding:6px;margin:8px 0;text-align:center}
.wallet button{background:none;border:0;padding:0;cursor:pointer}
.pseq{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;font-size:32px;margin:10px 0}
.pseq span{min-width:48px;height:54px;padding:0 4px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:#f5f5f5}
.pseq .qm{background:#fff3e0;border:2px dashed var(--ac);color:var(--ac);font-weight:800}
.opts.emo button{font-size:44px}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mcard{aspect-ratio:3/4;border-radius:10px;border:0;font-size:30px;background:linear-gradient(135deg,#7e57c2,#5c6bc0);color:#fff;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;padding:4px;transition:.25s;word-break:break-word}
.mcard.open{background:#fff;color:#222;border:2px solid #7e57c2}.mcard.done{background:#c8e6c9;color:#1b5e20;border:2px solid var(--g)}.mcard.sm.open,.mcard.sm.done{font-size:15px}
.bbcard{text-align:center;padding:16px}.bbe{font-size:100px}.bbt{font-size:22px;font-weight:600;margin:8px 0}.bbc{font-size:64px;font-weight:800;color:#e53935;min-height:70px}
.colwrap svg{width:100%;max-width:420px;display:block;margin:0 auto;background:#fff;border-radius:10px;box-shadow:0 0 0 1px #ddd}.colwrap .f{cursor:pointer}
.pal{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:10px 0}
.pal button{width:36px;height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #999;cursor:pointer}.pal button.on{box-shadow:0 0 0 3px #222;transform:scale(1.15)}
.hintbox svg{width:140px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px;margin-top:8px}
.sgrid button{border:2px solid #b39ddb;background:#ede7f6;border-radius:8px;padding:6px 0;font-family:inherit;cursor:pointer;font-size:20px}.sgrid small{display:block;font-size:13px;color:#6a1b9a}
.ptiles{display:flex;justify-content:center;gap:10px;margin:12px 0}
.ptile{width:76px;height:92px;border-radius:12px;background:#e3f2fd;border:3px solid #1565c0;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:46px;font-weight:800;color:#1565c0;font-family:inherit;transition:.2s}
.ptile small{font-size:17px;color:#6a1b9a}.ptile.hl{background:#fff176;transform:scale(1.1)}
.freec{touch-action:none;display:block;margin:0 auto;border:2px solid #333;border-radius:10px;background:#fff}
</style>
</head>
<body>
<header class="top"><button id="back" aria-label="వెనక్కి">←</button><h1 id="htitle">రాయ్ కిడ్స్ లెర్నింగ్ స్టూడియో</h1><span id="stars">⭐ 0</span></header>
<main>
<div class="home" id="home"><h2>🌈 రాయ్ కిడ్స్ లెర్నింగ్ స్టూడియో</h2><p class="mu" style="text-align:center;margin-top:-12px">Classes I–V • ఆడుతూ నేర్చుకుందాం • 🆕 = కొత్త బోధనా పద్ధతి</p><div id="menu"></div></div>
<div id="tools"></div>
</main>
<footer>© <a href="https://raayeducation.in" target="_blank" rel="noopener">రాయ్ ఎడ్యుకేషన్</a></footer>
<div id="toast"></div>
<script>
/* ================= UTILITIES ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const rnd=n=>Math.random()*n|0;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1900)}
function kb(b){return b<1024?b+' B':b<1048576?(b/1024).toFixed(1)+' KB':(b/1048576).toFixed(2)+' MB'}
function dl(blob,name){const a=document.createElement('a');a.href=typeof blob==='string'?blob:URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove()}
function copyText(t){if(!t){toast('టెక్స్ట్ లేదు');return}const fb=()=>{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('కాపీ అయింది ✔')};if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>toast('కాపీ అయింది ✔')).catch(fb);else fb()}
const isTe=t=>/[\u0C00-\u0C7F]/.test(t);
const loadedJS={};
function loadJS(src){return loadedJS[src]||(loadedJS[src]=new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>{delete loadedJS[src];rej(new Error('ఇంటర్నెట్ అవసరం – లైబ్రరీ లోడ్ కాలేదు'))};document.head.appendChild(s)}))}
function loadImg(file){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('ఫోటో తెరవలేకపోయాం'));i.src=URL.createObjectURL(file)})}
const toBlob=(c,t,q)=>new Promise(r=>c.toBlob(r,t,q));
const brand='<p class="brand mu" style="text-align:center">🌿 <a href="https://raayeducation.in" target="_blank" rel="noopener">రాయ్ ఎడ్యుకేషన్</a></p>';

/* ---- voice ---- */
let voices=[];function loadV(){voices=speechSynthesis.getVoices()}
if('speechSynthesis' in window){loadV();speechSynthesis.onvoiceschanged=loadV}
function pickV(l){l=l.toLowerCase();return voices.find(v=>v.lang.replace('_','-').toLowerCase()===l)||voices.find(v=>v.lang.toLowerCase().startsWith(l.slice(0,2)))}
function say(parts){if(!window.speechSynthesis){toast('ఈ ఫోన్‌లో వాయిస్ సపోర్ట్ లేదు');return}speechSynthesis.cancel();
 parts.forEach(([t,l,r])=>{if(!t)return;const u=new SpeechSynthesisUtterance(t);u.lang=l||'te-IN';const v=pickV(u.lang);if(v)u.voice=v;u.rate=r||.85;speechSynthesis.speak(u)})}
function stopSay(){window.speechSynthesis&&speechSynthesis.cancel()}

/* ================= 1. NUMBERS 0-999 ================= */
const TU=['సున్నా','ఒకటి','రెండు','మూడు','నాలుగు','ఐదు','ఆరు','ఏడు','ఎనిమిది','తొమ్మిది'];
const TT=['పది','పదకొండు','పన్నెండు','పదమూడు','పద్నాలుగు','పదిహేను','పదహారు','పదిహేడు','పద్దెనిమిది','పందొమ్మిది'];
const TTEN=['','','ఇరవై','ముప్పై','నలభై','యాభై','అరవై','డెబ్బై','ఎనభై','తొంభై'];
function te2(n){if(n<10)return TU[n];if(n<20)return TT[n-10];const t=TTEN[n/10|0],r=n%10;return r?t+' '+TU[r]:t}
function teNum(n){if(n<100)return te2(n);const h=n/100|0,r=n%100;const w=h===1?(r?'నూట':'వంద'):TU[h]+(r?' వందల':' వందలు');return r?w+' '+te2(r):w}
const EU=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const ET=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function en2(n){if(n<20)return EU[n];const r=n%10;return ET[n/10|0]+(r?'-'+EU[r]:'')}
function enNum(n){if(n<100)return en2(n);const h=n/100|0,r=n%100;return EU[h]+' hundred'+(r?' and '+en2(r):'')}
const teDig=n=>String(n).replace(/\d/g,d=>'౦౧౨౩౪౫౬౭౮౯'[d]);

function initNum(){
 const s=$('#t1');let base=0,cur=0,auto=null,score=0,tot=0,qAns=null;
 s.innerHTML=`<div class="card"><div class="row" id="nrng"></div>
 <div class="row" style="margin-top:10px"><input id="nin" type="number" min="0" max="999" placeholder="సంఖ్య (0-999)" style="width:150px"><button class="btn" id="ngo">చూపించు</button>
 <button class="btn a" id="nauto">▶ ఆటో ప్లే</button><button class="btn o" id="nqb">🎯 క్విజ్</button></div></div>
 <div class="card" id="nq" style="display:none"></div>
 <div class="card" id="ndet"></div>
 <div class="card"><div class="ngrid" id="ngrid"></div></div>${brand}`;
 const rng=$('#nrng',s);
 for(let i=0;i<10;i++){const c=document.createElement('button');c.className='chip';c.dataset.b=i*100;c.textContent=`${i*100}-${i*100+99}`;c.onclick=()=>{setBase(i*100);show(i*100,false)};rng.appendChild(c)}
 function setBase(b){base=b;$$('.chip',rng).forEach(c=>c.classList.toggle('on',+c.dataset.b===b));const g=$('#ngrid',s);g.innerHTML='';
  for(let n=b;n<b+100;n++){const x=document.createElement('button');x.textContent=n;x.dataset.n=n;x.onclick=()=>show(n,true);g.appendChild(x)}}
 function show(n,sp){cur=n;if(n<base||n>=base+100)setBase(Math.floor(n/100)*100);
  $$('#ngrid button',s).forEach(b=>b.classList.toggle('on',+b.dataset.n===n));
  const h=n/100|0,t=(n/10|0)%10,o=n%10;
  $('#ndet',s).innerHTML=`<div class="bignum">${n}</div><div class="tedig">${teDig(n)}</div>
  <div class="pv"><div><b>${h}</b><span>వందలు<br>H</span></div><div><b>${t}</b><span>పదులు<br>T</span></div><div><b>${o}</b><span>ఒకట్లు<br>O</span></div></div>
  <div class="mu" style="text-align:center">${h*100} + ${t*10} + ${o} = ${n}</div>
  <div class="enw">${enNum(n)}</div><div class="tew">${teNum(n)}</div>
  <div class="row" style="justify-content:center"><button class="btn o" id="np">◀</button><button class="btn" id="nse">🔊 English</button><button class="btn" id="nst">🔊 తెలుగు</button><button class="btn o" id="nn">▶</button></div>`;
  $('#nse',s).onclick=()=>say([[enNum(n),'en-IN']]);$('#nst',s).onclick=()=>say([[teNum(n),'te-IN']]);
  $('#np',s).onclick=()=>show(Math.max(0,n-1),true);$('#nn',s).onclick=()=>show(Math.min(999,n+1),true);
  if(sp)say([[enNum(n),'en-IN'],[teNum(n),'te-IN']]);}

 $$('#clc button',s).forEach(b=>b.onclick=()=>{const p=PAL.find(x=>x[0]===b.dataset.c);pick(p[0],p[1],p[2])});$('#clx',s).oninput=e=>pick(e.target.value);
 const cv=$('#clf',s);let drawing=false;
 function load(){undo=[];$('#clhint',s).style.display='none';$('#clw',s).style.display=free?'none':'block';cv.style.display=free?'block':'none';$('#clbz',s).style.display=free?'inline':'none';$('#clh',s).style.display=free?'none':'inline-block';$('#clpr',s).style.display=free?'none':'inline-block';
  if(free){const W=Math.min(420,innerWidth-60),d=Math.min(2,devicePixelRatio||1);cv.width=W*d;cv.height=W*d;cv.style.width=W+'px';cv.style.height=W+'px';const x=cv.getContext('2d');x.setTransform(d,0,0,d,0,0);x.fillStyle='#fff';x.fillRect(0,0,W,W)}
  else{$('#clw',s).innerHTML=picSVG(PICS[pi][2]);$('#clw svg',s).addEventListener('click',e=>{const t=e.target;if(!t.classList.contains('f'))return;undo.push([t,t.getAttribute('fill')]);t.setAttribute('fill',col)})}}
 const pos=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
 cv.addEventListener('pointerdown',e=>{drawing=true;cv.setPointerCapture(e.pointerId);const x=cv.getContext('2d');undo.push(x.getImageData(0,0,cv.width,cv.height));if(undo.length>20)undo.shift();const[a,b]=pos(e);x.strokeStyle=col;x.lineWidth=brush;x.lineCap='round';x.lineJoin='round';x.beginPath();x.moveTo(a,b);x.lineTo(a+.1,b);x.stroke()});
 cv.addEventListener('pointermove',e=>{if(!drawing)return;const x=cv.getContext('2d'),[a,b]=pos(e);x.lineTo(a,b);x.stroke()});['pointerup','pointercancel'].forEach(v=>cv.addEventListener(v,()=>drawing=false));
 $('#clb',s).onchange=e=>brush=+e.target.value;
 $('#clu',s).onclick=()=>{const u=undo.pop();if(!u)return;if(free)cv.getContext('2d').putImageData(u,0,0);else u[0].setAttribute('fill',u[1])};
 $('#clr',s).onclick=()=>{if(confirm('అంతా తుడిచేయాలా?'))load()};
 $('#clh',s).onclick=()=>{const h=$('#clhint',s);h.style.display=h.style.display==='none'?'block':'none';h.innerHTML='<p class="mu">💡 ఇలా వేయవచ్చు (మీకు నచ్చిన రంగులు కూడా వేయవచ్చు!)</p>'+picSVG(PICS[pi][2],true)};
 $('#cls',s).onclick=()=>{const name=free?'raay_my_drawing.png':`raay_coloring_${PICS[pi][1]}.png`;if(free){cv.toBlob(b=>dl(b,name),'image/png');return}
  const xml=new XMLSerializer().serializeToString($('#clw svg',s)),img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=c.height=900;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,900,900);x.drawImage(img,0,0,900,900);c.toBlob(b=>{dl(b,name);addStar()},'image/png')};img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(xml)};
 $('#clpr',s).onclick=()=>{const w=window.open('');if(!w){toast('ప్రింట్ విండో తెరవలేదు');return}w.document.write(`<html><head><title>${PICS[pi][0]}</title><style>body{margin:0;text-align:center;font-family:sans-serif}svg{width:18cm;height:18cm}h2{margin:12px}</style></head><body><h2>${PICS[pi][0]} – రంగులు వేయండి</h2><p>పేరు: ______________________</p>${picSVG(PICS[pi][2])}<p>రాయ్ ఎడ్యుకేషన్ • raayeducation.in</p><script>setTimeout(()=>print(),400)<\/script></body></html>`);w.document.close()};
 pick(col,'ఎరుపు','red');stopSay();load();
}
